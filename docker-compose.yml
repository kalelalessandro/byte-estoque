services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: byteforce
      POSTGRES_PASSWORD: byteforce
      POSTGRES_DB: byteforce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byteforce"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://byteforce:byteforce@db:5432/byteforce?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-troque-em-producao}"
      AUTH_URL: "http://localhost:3000"
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"

volumes:
  pgdata:
